# dsh-paste-image bundle patch(本包自带的挂载层)
#
# 让纯文本模型也能粘贴图片:
#   - 客户端不拦截粘贴, 完全走 DSH 原生粘贴(图片预览 + 原生发送)。
#   - 宿主端包装 apiProxy.sessions.prompt: 当模型不支持图片输入时, 把 image
#     block 持久化到附件存储并替换成 [已粘贴图片: sha256:…] 文本标记后重试,
#     模型看到标记后调用 tool-vision 识图。
#
# 用官方 CLI 安装后 ——
#
#   dsh plugin --profile web add link:<本目录绝对路径>
#
# CLI 会协调 dsh.profile.bundles, 发现本包声明了 dsh.bundle.patch 后把它追加进
# bundle 栈; profile boot 时本文件作为一个 patch 层合并(与手动在
# ~/.dsh/profiles/web/cordis.patch.yml 写挂载行等价), host 半随 DSH 启动自动挂载。
# 不要同时再手动挂载本插件, 否则会双挂载(两个 Node 半)。
- insert:
    - id: paste-image
      name: 'dsh-paste-image'
