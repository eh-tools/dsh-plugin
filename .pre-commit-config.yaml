# 检查分层:
#   commit     秒级: lint + format + 密钥扫描 + 内置轻量检查
#   commit-msg Conventional Commits 强制 + 行为类提交 body 完整性
#   pre-push   全量: 语法检查 + 冒烟测试 + 依赖审计 (repo: local, 用项目自己的环境)
#
# 版本升级: pre-commit autoupdate
default_install_hook_types: [pre-commit, pre-push, commit-msg]

repos:
  # ---- 内置轻量检查 (commit) ----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^plugins/obsolete/tool-vision/cordis\.yml$ # markdown 内容, 非 YAML
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: mixed-line-ending
        args: [--fix=lf]

  # ---- 密钥扫描 (commit) ----
  # 需要本机安装 gitleaks
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks 密钥扫描
        entry: gitleaks protect --verbose --redact --staged
        language: system
        pass_filenames: false

  # ---- JS: prettier + eslint (commit) ----
  # 经 node 直接调 JS 入口, 跨平台(macOS/Linux CI 与 Windows 均可; 不经
  # node_modules/.bin 的 #!/bin/sh 包装, 避免 Windows 下 /bin/sh 缺失)。
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: node node_modules/prettier/bin/prettier.cjs --write --ignore-unknown
        language: system
        types_or: [javascript, ts, tsx, json, yaml, markdown, css, html]
      - id: eslint
        name: eslint
        entry: node node_modules/eslint/bin/eslint.js --fix
        language: system
        types_or: [javascript, ts, tsx]

  # ---- Conventional Commits (commit-msg) ----
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # ---- 提交信息内容完整性 (commit-msg): fix/perf/refactor 必填「标签: 内容」body ----
  - repo: local
    hooks:
      - id: commit-message-body
        name: commit message 内容完整性
        entry: python3 scripts/commit-message-body.py
        language: system
        stages: [commit-msg]

  # ---- 主分支保护 (commit): 拒 main 直接提交, 放行 merge 与首个提交 ----
  - repo: local
    hooks:
      - id: no-commit-on-main
        name: 禁止直接提交 main
        entry: python3 scripts/no-commit-on-main.py
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

  # ---- 全量检查 (pre-push) ----
  - repo: local
    hooks:
      - id: node-check
        name: node --check 语法检查
        entry: node --check
        language: system
        stages: [pre-push]
        files: \.m?js$
      - id: smoke
        name: 冒烟测试 (tool-vision)
        entry: node plugins/obsolete/tool-vision/tests/smoke.mjs
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
      - id: pnpm-audit
        name: pnpm audit 依赖审计(全量, 含 dev)
        # ⚠ 不带 `--prod`: dev / 传递依赖里的高危同样要拦(js-yaml 那条就是这么漏过去的)
        entry: pnpm audit
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
