# 检查分层:
#   commit     秒级: lint + format + 密钥扫描 + 内置轻量检查
#   commit-msg Conventional Commits 强制
#   pre-push   全量: 语法检查 + 冒烟测试 + 依赖审计 (repo: local, 用项目自己的环境)
#
# 版本升级: pre-commit autoupdate
default_install_hook_types: [pre-commit, pre-push, commit-msg]

repos:
  # ---- 内置轻量检查 (commit) ----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^plugins/tool-vision/cordis\.yml$ # markdown 内容, 非 YAML
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: mixed-line-ending
        args: [--fix=lf]

  # ---- 密钥扫描 (commit) ----
  # 需要本机安装 gitleaks
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks 密钥扫描
        entry: gitleaks protect --verbose --redact --staged
        language: system
        pass_filenames: false

  # ---- JS: prettier + eslint (commit) ----
  # 直接调 node_modules/.bin, 保证版本与 package.json 一致
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: node_modules/.bin/prettier --write --ignore-unknown
        language: system
        types_or: [javascript, ts, tsx, json, yaml, markdown, css, html]
      - id: eslint
        name: eslint
        entry: node_modules/.bin/eslint --fix
        language: system
        types_or: [javascript, ts, tsx]

  # ---- Conventional Commits (commit-msg) ----
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # ---- 主分支保护 (commit): 拒 main 直接提交, 放行 merge 与首个提交 ----
  - repo: local
    hooks:
      - id: no-commit-on-main
        name: 禁止直接提交 main
        entry: python3 scripts/no-commit-on-main.py
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

  # ---- 全量检查 (pre-push) ----
  - repo: local
    hooks:
      - id: node-check
        name: node --check 语法检查
        entry: node --check
        language: system
        stages: [pre-push]
        files: \.m?js$
      - id: smoke
        name: 冒烟测试 (tool-vision)
        entry: node plugins/tool-vision/tests/smoke.mjs
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
      - id: pnpm-audit
        name: pnpm audit 依赖审计
        entry: pnpm audit --prod
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
